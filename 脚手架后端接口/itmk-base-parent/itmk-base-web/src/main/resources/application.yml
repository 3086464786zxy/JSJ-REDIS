spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/itmk?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 2
          max-wait: 1000ms
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${SERVER_PORT:8090}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    connection-timeout: 10s
    max-http-form-post-size: 2MB
    threads:
      max: 200
  compression:
    enabled: true
    min-response-size: 2KB
jwt:
  issuer: itmk
  audience: itmk-api
  secret: ${JWT_SECRET}
  expiration: 15
  refresh-expiration: 10080
app:
  security:
    session-idle-timeout-minutes: 30
    captcha-ttl-seconds: 120
    permission-ttl-seconds: 900
    permission-ttl-jitter-seconds: 180
    refresh-token:
      cookie-name: refresh_token
      cookie-secure: ${COOKIE_SECURE:true}
      cookie-same-site: Lax
    rate-limit:
      captcha-per-minute: 20
      login-ip-per-minute: 20
      login-user-per-minute: 10
ignore:
  url: /api/sysUser/login,/api/sysUser/getImage,/api/refresh,/api/sysUser/loginOut
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
logging:
  file:
    name: ${LOG_FILE:logs/itmk.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 1GB
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger requestId=%X{requestId} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger requestId=%X{requestId} - %msg%n'

#端口号配置
server:
  #port: 8089
  port: 8090
#数据库连接配置
spring:
  main:
    allow-circular-references: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/itmk_base?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: 123456

#jwt配置
jwt:
  #颁发者
  issuer: itmk
  #接收该 Token 的 API
  audience: itmk-api
  #生产环境必须通过 JWT_SECRET 环境变量提供至少 32 字节的随机密钥
  secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
  #Access Token 15分钟过期，持续操作时由 RefreshToken 换发
  expiration: 15
  #Refresh Token 7天过期（分钟）
  refresh-expiration: 10080

#认证缓存和限流参数，可按压测结果通过环境配置覆盖
app:
  security:
    # 仅限制连续闲置时间；持续有效操作没有最长登录时限
    session-idle-timeout-minutes: 30
    captcha-ttl-seconds: 120
    permission-ttl-seconds: 900
    permission-ttl-jitter-seconds: 180
    refresh-token:
      cookie-name: refresh_token
      cookie-secure: false   # 生产环境设置为 true（仅 HTTPS）
      cookie-same-site: Lax
    rate-limit:
      captcha-per-minute: 20
      login-ip-per-minute: 20
      login-user-per-minute: 10

#不需要token验证的请求，逗号分隔配置
ignore:
  url: /api/sysUser/login,/api/sysUser/getImage,/api/refresh,/api/sysUser/loginOut

#mybatis plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      #配置mybatis plus 在更新时只更新非空和非NULL的字段
      update-strategy: not_empty

logging:
  pattern:
    console: '%d{yyyy-MM-dd} [%thread] %-5level %logger- %msg%n'

# Redis 配置
spring.data.redis:
  host: localhost
  port: 6379
  database: 0
  timeout: 5000ms
  lettuce:
    pool:
      max-active: 32
      max-idle: 16
      min-idle: 4
      max-wait: 1000ms

# Prometheus and blackbox exporter must run on the same host/network namespace as the management listener.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: itmk-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:9091']
  - job_name: itmk-readiness
    metrics_path: /probe
    params:
      module: [itmk_ready]
    static_configs:
      - targets: ['http://127.0.0.1:9091/actuator/health/readiness']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
